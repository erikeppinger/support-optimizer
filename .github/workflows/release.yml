name: Release desktop builds

# Manual trigger (Actions tab → this workflow → "Run workflow"), or push a
# version tag (git tag v1.0.2 && git push --tags) — either builds Windows,
# macOS (both Intel and Apple Silicon), and Linux installers and attaches
# them to a draft GitHub Release for review before publishing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          # A personal access token, not the built-in GITHUB_TOKEN: since
          # 2026-10-01 the built-in one is refused when creating the release
          # ("Resource not accessible by integration") despite contents: write.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Support Optimizer v__VERSION__"
          # Update this before tagging each release — see the assets
          # below to download and install for your platform.
          releaseBody: |
            - Fixed: several in-app help ("?") texts still described how the app worked before v1.0.6. Fill cavities and Fill tunnels now explain the current sealing margins (a buried cavity is sealed in full, a tunnel always keeps a 1-voxel margin so its opening is never closed over), and Find cavities / Find tunnels no longer claim that each button refreshes both lists.
            - The Optimize orientation help now mentions that the search is randomly rotated on every run, so the result doesn't depend on how the structure is oriented in its file
            - Smaller help-text corrections for Undo and "Ligands & ions found"
            - The README now links to these installers, explains how releases are published, and describes water/ligand handling, 3MF colors and the colorblind toggle
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
