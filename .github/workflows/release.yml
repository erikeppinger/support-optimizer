name: Release desktop builds

# Manual trigger (Actions tab → this workflow → "Run workflow"), or push a
# version tag (git tag v1.0.2 && git push --tags) — either builds Windows,
# macOS (both Intel and Apple Silicon), and Linux installers and attaches
# them to a draft GitHub Release for review before publishing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Support Optimizer v__VERSION__"
          # Update this before tagging each release — see the assets
          # below to download and install for your platform.
          releaseBody: |
            - Fixed: drag-and-drop didn't work in the installed Windows app (Tauri was intercepting file drops before the page ever saw them)
            - Tunnels and cavities are now reviewed/filled as two independent lists — finding one no longer resets your review of the other
            - Fixed a horizontal scrollbar appearing when multiple sections were expanded
            - Oversized-void safety check: Fill now refuses a "cavity"/"tunnel" that's actually a large fraction of the model's own volume, instead of concatenating a giant patch
            - Export STL/3MF now opens a native Save As dialog instead of always dropping into Downloads (desktop app only)
            - Orientation search is no longer biased by a structure's arbitrary file-coordinate pose
            - Reduced idle GPU usage
            - Organic support-path preview: choose Organic (tree-like), Snug (straight, follows the model's shape), or Grid (straight, regular lattice) — still illustrative only, never affects export
            - New app icon
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
