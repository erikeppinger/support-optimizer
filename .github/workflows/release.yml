name: Release desktop builds

# Manual trigger (Actions tab → this workflow → "Run workflow"), or push a
# version tag (git tag v1.0.2 && git push --tags) — either builds Windows,
# macOS (both Intel and Apple Silicon), and Linux installers and attaches
# them to a draft GitHub Release for review before publishing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # The draft is created once, before the builds. Letting each build create
  # it raced at v1.0.12: two builds each made their own draft and the
  # installers were split between them.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        uses: actions/github-script@v7
        env:
          # Update this before tagging each release — see the assets
          # below to download and install for your platform.
          RELEASE_BODY: |
            - New: Quick start and All settings. Quick start shows each step's main buttons with good defaults; All settings shows every control. The welcome dialog asks which you prefer, and a switch at the top of the panel changes it any time.
            - Optimize can now also cut down color changes for prints in several colors. Least support turns the model so it needs the least support material; Fewest tool changes turns it so the printer switches colors less often, which saves time and purged filament; Balanced weighs both. The status line shows how many changes the print needs before and after.
            - Find cavities now also finds very small empty spaces sealed inside a single chain. They are closed on all sides, so you can't see them from outside, but the slicer would print each one as a tiny hollow space. Fill makes them solid. Grooves and pockets that are open to the surface are never touched.
            - Fill leaves far fewer hollow spaces inside the print. Filling a cavity close to the outer wall could trap a thin empty gap between the fill and the wall; Fill now finds those and fills them too. The "Close gaps narrower than the nozzle" export option is removed, because it trapped new empty spaces instead of closing gaps.
        with:
          # A personal access token, not the built-in GITHUB_TOKEN: since
          # 2026-10-01 the built-in one is refused when creating the release
          # ("Resource not accessible by integration") despite contents: write.
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const version = require(`${process.env.GITHUB_WORKSPACE}/src-tauri/tauri.conf.json`).version;
            const tag = `v${version}`;
            // Reuse a draft that already exists for this tag (a re-run)
            // rather than adding a second one.
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find((r) => r.tag_name === tag && r.draft);
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Support Optimizer ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            return data.id;

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
