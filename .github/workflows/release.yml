name: Release desktop builds

# Manual trigger (Actions tab → this workflow → "Run workflow"), or push a
# version tag (git tag v1.0.2 && git push --tags) — either builds Windows,
# macOS (both Intel and Apple Silicon), and Linux installers and attaches
# them to a draft GitHub Release for review before publishing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Support Optimizer v__VERSION__"
          # Update this before tagging each release — see the assets
          # below to download and install for your platform.
          releaseBody: |
            - New: colorblind-safe color toggle. It switches the chain colors to the Tol Muted palette (and back), and the axis gizmo, overhang shading and cavity-highlight colors to Okabe–Ito colors. Structures loaded while it's on start with the safe palette. A chain palette you picked yourself is kept; colors from an imported 3MF stay the file's own.
            - Fixed: a 3MF file that carries color only as slicer paint data (PrusaSlicer's `slic3rpe:mmu_segmentation` / Bambu-Orca's `paint_color` — e.g. files exported by ChimeraX's own 3MF exporter) imported as one flat gray color instead of its original per-part colors
            - Reworked ion/ligand handling: instead of one global "include ions & ligands" toggle, loading a PDB/mmCIF now shows a checklist of the heteroatoms actually present in that file, so you choose which ones to keep before the surface is built
            - Fixed: cavity sealing was skipping the large majority of detected voids as "too thin to seal," and got worse (not better) at higher resolution — sealing now erodes by a margin based on how far a cavity actually sits from the model's exterior, instead of one fixed margin for every cavity regardless of depth
            - The version badge now reads "v: 1.x.y" in the lower-right corner
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
