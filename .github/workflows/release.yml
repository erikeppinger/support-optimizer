name: Release desktop builds

# Manual trigger (Actions tab → this workflow → "Run workflow"), or push a
# version tag (git tag v1.0.2 && git push --tags) — either builds Windows,
# macOS (both Intel and Apple Silicon), and Linux installers and attaches
# them to a draft GitHub Release for review before publishing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # The draft is created once, before the builds. Letting each build create
  # it raced at v1.0.12: two builds each made their own draft and the
  # installers were split between them.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        uses: actions/github-script@v7
        env:
          # Update this before tagging each release — see the assets
          # below to download and install for your platform.
          RELEASE_BODY: |
            - Clearer messages. The status line now says in plain words what each step did, for example "Filled 42 cavities. The outside of the model is unchanged." or "Optimized: about 7% less support; tool changes 1,256 → 930." The detailed numbers are still in the session log.
            - Plainer labels. Section 3 is now "Cavities & tunnels", and settings read "Detection detail", "Overhang threshold" and "Raise the model by (mm)". Cavity sizes and the size limit are shown in mm³ instead of voxels, and the detail settings no longer show grid sizes such as 64³.
        with:
          # A personal access token, not the built-in GITHUB_TOKEN: since
          # 2026-10-01 the built-in one is refused when creating the release
          # ("Resource not accessible by integration") despite contents: write.
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const version = require(`${process.env.GITHUB_WORKSPACE}/src-tauri/tauri.conf.json`).version;
            const tag = `v${version}`;
            // Reuse a draft that already exists for this tag (a re-run)
            // rather than adding a second one.
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find((r) => r.tag_name === tag && r.draft);
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Support Optimizer ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            return data.id;

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
