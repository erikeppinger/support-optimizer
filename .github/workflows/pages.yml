name: Deploy browser version to GitHub Pages

# Publishes the browser build to https://erikeppinger.github.io/support-optimizer/
# on every push to main, or manually from the Actions tab. Requires
# Settings → Pages → Source set to "GitHub Actions" once. Triggered by main
# rather than version tags because the github-pages environment only accepts
# deployments from the default branch unless a tag rule is added to it.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install npm dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The in-app About dialog links here.
      - name: Add the manual
        run: cp docs/MANUAL.html dist/manual.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
